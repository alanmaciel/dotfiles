# ~/.tmux.conf
# Base heredada de thoughtbot/dotfiles (lo que se usaba), seguida de lo propio.

# ── Base ─────────────────────────────────────────────────────────────────
bind-key -r C-h select-window -t :-
bind-key -r C-l select-window -t :+

# Prefijo secundario C-s (el principal, C-a, se define más abajo)
set -g prefix2 C-s
bind-key C-s send-prefix -2

# Barra de estado gris y sin sesión/host/hora
set -g status-style bg='#666666',fg='#aaaaaa'
set -g status-left ''
set -g status-right ''

# No suspender el cliente con C-z
unbind-key C-z

# ── Personal ─────────────────────────────────────────────────────────────
# Use vim keybindings in copy mode (sintaxis tmux >= 2.4)
setw -g mode-keys vi
bind ` copy-mode
unbind p
bind p paste-buffer
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi Escape send -X cancel
bind y run "tmux save-buffer - | pbcopy"

# Desde tmux 2.6 ya no hace falta reattach-to-user-namespace para pbcopy
set -g default-shell /bin/zsh

# tmux-256color trae cursiva; RGB habilita truecolor en Ghostty
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB,xterm-256color:RGB"
set -g history-limit 20000
# use VI
set-window-option -g mode-keys vi

# Use ctrl-a instead of ctrl-b
set -g prefix C-a
unbind C-b
bind C-a send-prefix
bind a send-prefix

# status refresh interval
set -g status-interval 2

# reload config
unbind r
bind r source-file ~/.tmux.conf \; display "Reloaded!"

unbind ^T
bind ^T split-window -p 25

# horizontal and vertical splits
unbind |
bind | split-window -h
unbind _
bind _ split-window

# tile all windows
unbind =
bind = select-layout tiled

# cycle through panes
unbind ^A
bind ^A select-pane -t :.+

unbind Right
bind Right resize-pane -R 8
unbind Left
bind Left resize-pane -L 8
unbind Up
bind Up resize-pane -U 4
unbind Down
bind Down resize-pane -D 4

unbind h
bind h select-pane -L
unbind j
bind j select-pane -D
unbind k
bind k select-pane -U
unbind l
bind l select-pane -R

# status bar
# set -g status-bg black
# set -g status-fg yellow
# set -g status-interval 1
# set -g status-right-length 60
set -g renumber-windows on
set -g base-index 1
set -g pane-base-index 1

# set -g status-left ' '
#set -g status-right '#(battery-life) (#(battery-time)) #[fg=yellow]%Y-%m-%d %H:%M#[default] '
# set -g status-right '#[fg=yellow]%Y-%m-%d %H:%M#[default] '

