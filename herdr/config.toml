onboarding = false

# ── Interface ─────────────────────────────────────────────────────────
[ui]
status_indicators = "symbols"
prompt_new_tab_name = false
agent_panel_sort = "priority"
show_agent_labels_on_pane_borders = true
pane_gaps = false
copy_on_select = true

# Sidebar: which columns each row shows for agents and for spaces.
[ui.sidebar.agents]
row_gap = 0
rows = [
  ["state_icon", {token = "terminal_title_stripped", dim = false, fg = "#ffffff"}],
  [{token = "workspace", bold = false}]
]

[ui.sidebar.spaces]
row_gap = 0
rows = [
  ["state_icon", "workspace", "branch", "git_status"],
]

# Toast notifications (off) and clipboard-copy toasts.
[ui.toast]
delivery = "off"

[ui.toast.clipboard]
enabled = false
position = "top-right"

[ui.sound]
enabled = false

# ── Theme ─────────────────────────────────────────────────────────────
# Stronger highlight for the focused Agent / active Space row and the
# Navigate-mode cursor row in the sidebar.
[theme.custom]
active_row_bg = "#3d4a6b"
selection_bg = "#5a4a7a"
